name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          if [ -f flight_price_pipeline/requirements.txt ]; then 
            pip install -r flight_price_pipeline/requirements.txt
          fi
      
      - name: Lint with flake8
        working-directory: ./flight_price_pipeline
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
      
      - name: Run unit tests with coverage
        working-directory: ./flight_price_pipeline
        run: |
          python -m pytest tests/unit/ -v --cov=dags/utils --cov-report=xml --cov-report=term-missing
        continue-on-error: true
      
      - name: Upload coverage reports
        if: always() && hashFiles('flight_price_pipeline/coverage.xml') != ''
        uses: codecov/codecov-action@v3
        with:
          file: ./flight_price_pipeline/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      
      - name: Run integration tests
        working-directory: ./flight_price_pipeline
        run: |
          if [ -d "tests/integration" ]; then
            python -m pytest tests/integration/ -v
          else
            echo "⚠️ No integration tests directory found"
          fi
        continue-on-error: true
      
      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            flight_price_pipeline/coverage.xml
            flight_price_pipeline/.coverage
          if-no-files-found: ignore
  
  validate-dbt:
    name: Validate DBT Models
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install DBT with compatible dependencies
        run: |
          pip install protobuf==4.25.3
          pip install dbt-postgres==1.7.4
      
      - name: Verify DBT installation
        run: |
          dbt --version
      
      - name: Create mock DBT profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          flight_analytics:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                user: ci_user
                password: ci_pass
                port: 5432
                dbname: ci_db
                schema: bronze
                threads: 1
          EOF
      
      - name: DBT Parse (Validate SQL)
        working-directory: ./flight_price_pipeline/dbt_project
        run: |
          dbt parse --no-version-check

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Validate docker-compose.yml
        working-directory: ./flight_price_pipeline
        run: |
          docker compose config
      
      - name: Build Docker images (dry run)
        working-directory: ./flight_price_pipeline
        run: |
          docker compose build --no-cache || echo "Docker build test completed"
  
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './flight_price_pipeline'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
  
  build-status:
    name: Build Status Summary
    runs-on: ubuntu-latest
    needs: [lint-and-test, validate-dbt, docker-build]
    if: always()
    
    steps:
      - name: Check build status
        run: |
          echo "✅ CI/CD Pipeline Completed"
          echo "📊 Lint: ${{ needs.lint-and-test.result }}"
          echo "🔧 DBT Validation: ${{ needs.validate-dbt.result }}"
          echo "🐳 Docker Build: ${{ needs.docker-build.result }}"
